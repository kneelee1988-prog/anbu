// ── API 호출 (모든 요청은 Edge Function 통해서) ───────────────
async function api(action, params = {}) {
  const res = await fetch(FN_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + ANON_KEY,
      "apikey": ANON_KEY
    },
    body: JSON.stringify({ action, ...params })
  });
  return res.json();
}

    headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
  });
  return res.json();
}

// ── 유틸 ──────────────────────────────────────────────────────
const today = () => {
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return kst.toISOString().slice(0, 10);
};
const now = () => new Date().toISOString();
const fmtDate = (s) => {
  if (!s) return "";
  const d = new Date(s);
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
};
const getWard = (room) => room || "";
const admitDays = (admittedAt) => {
  if (!admittedAt) return 0;
  const diff = new Date() - new Date(admittedAt);
  return Math.floor(diff / (1000*60*60*24)) + 1;
};

      },

// ── 로그인 화면 ───────────────────────────────────────────────
function LoginScreen({ loginType, onLogin, onBack, onSignup }) {
  const [form, setForm] = useState({ identifier: "", password: "", patientName: "", birthdate: "", phone: "" });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const bgColors = {
    guardian: "linear-gradient(160deg,#1e3a5f,#2563eb)",
    nurse: "linear-gradient(160deg,#064e3b,#059669)",
    doctor: "linear-gradient(160deg,#1e1b4b,#4338ca)",
    messages: "linear-gradient(160deg,#1e3a5f,#0891b2)",
    admin: "linear-gradient(160deg,#1c1917,#44403c)",
  };
  const titles = { guardian: "👨‍👩‍👧 보호자 로그인", nurse: "👩‍⚕️ 간호사 로그인", doctor: "🩺 의사 로그인", messages: "💬 보호자 한마디", admin: "👑 관리자 로그인" };
  const WARDS = ["믿음병동", "소망병동", "사랑병동", "행복병동"];
  const DOCTORS = ["이요성", "김성민", "박지원", "최동훈", "정한솔"];

  const handleLogin = async () => {
    setError(""); setLoading(true);
    try {
      let result;
      if (loginType === "guardian") {
        if (!form.patientName || !form.birthdate || !form.phone) { setError("모든 항목을 입력해주세요."); return; }
        result = await api("guardian_login", { patientName: form.patientName.trim(), birthdate: form.birthdate.trim(), phone: form.phone.trim() });
        if (result.error) { setError(result.error); return; }
        onLogin({ role: "guardian", patient: result.patient, guardianRole: result.guardianRole, phone: form.phone });
      } else {
        const role = loginType === "messages" ? (form.msgRole || "nurse") : loginType;
        const identifier = role === "nurse" ? (form.ward || WARDS[0]) : form.identifier;
        if (!identifier || !form.password) { setError("모든 항목을 입력해주세요."); return; }
        result = await api("staff_login", { identifier, password: form.password, role });
        if (result.error) { setError(result.error); return; }
        onLogin({ ...result.user, loginAs: loginType });
      }
    } catch(e) { setError("오류가 발생했습니다. 다시 시도해주세요."); }
    finally { setLoading(false); }
  };

  const handleKeyDown = (e) => { if (e.key === "Enter" && !loading) handleLogin(); };

  return React.createElement("div", { className: "screen", style: { background: bgColors[loginType] || bgColors.guardian } },
    React.createElement("div", { className: "header", style: { paddingTop: 48 } },

    React.createElement("div", { style: { display: "flex", alignItems: "flex-end", gap: 2, height: 80 } },
      days.map((r, i) => {

          React.createElement("div", { style: { fontSize: 9, fontWeight: 800, color: !displayVal ? "#cbd5e1" : color, minHeight: 14, textAlign: "center", lineHeight: 1.3, width: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, displayVal),
          React.createElement("div", { style: { width: "100%", height: 48, display: "flex", alignItems: "flex-end", justifyContent: "center" } },
            React.createElement("div", { style: {
              width: isToday ? "60%" : "44%",
              height: pct > 0 ? `${pct}%` : "3px",

const CHART_COLOR = {
  // 최고=파랑, 좋음=초록, 보통=연두, 주의=주황, 나쁨=빨강
  goodHigh: (v, max) => {
    const p = v / max;
    return p >= 1.0 ? "#2563eb"   // 최고 - 파랑
         : p >= 0.75 ? "#16a34a"  // 좋음 - 초록
         : p >= 0.5  ? "#65a30d"  // 보통 - 연두
         : p >= 0.25 ? "#f59e0b"  // 주의 - 주황
         : "#ef4444";              // 나쁨 - 빨강
  },
  // 통증: 낮을수록 좋음 (0~3점=파랑)
  pain: (v) => v <= 3  ? "#2563eb"  // 최고 - 파랑
             : v <= 5  ? "#16a34a"  // 좋음 - 초록
             : v <= 7  ? "#65a30d"  // 보통 - 연두
             : v <= 8  ? "#f59e0b"  // 주의 - 주황
             : "#ef4444",           // 나쁨 - 빨강
  // 섬망: 낮을수록 좋음 (없음=파랑)
  delirium: (v, max) => {
    const p = v / max;
    return p === 0    ? "#2563eb"   // 없음 - 파랑
         : p <= 0.15  ? "#2563eb"   // 없음 - 파랑
         : p <= 0.35  ? "#16a34a"   // 경미 - 초록
         : p <= 0.55  ? "#65a30d"   // 보통 - 연두
         : p <= 0.75  ? "#f59e0b"   // 심함 - 주황
         : "#ef4444";               // 극심 - 빨강
  },
  // 의식: 명료=파랑, 졸림=주황, 혼미이하=빨강
  consciousness: (v) => v === 5 ? "#2563eb"  // 명료 - 파랑
                      : v === 4 ? "#f59e0b"  // 졸림 - 주황
                      : "#ef4444",            // 혼미 이하 - 빨강
};

// 사진 박스 컴포넌트
// 사진 로드 공통 훅 (limit 옵션 추가)
function usePatientPhotos(patientId, limit = 20) {
  const [photos, setPhotos] = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  const loadPhotos = () => {
    setLoading(true);
    fetch(`${SUPABASE_URL}/storage/v1/object/list/patient-photos`, {
      method: "POST",
      headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: `${patientId}/`, limit: limit, sortBy: { column: "created_at", order: "desc" } })
    }).then(r => r.json())
      .then(data => {
        if (Array.isArray(data)) {
          const today = new Date().toLocaleDateString("ko-KR", { month:"long", day:"numeric" });
          setPhotos(data.filter(f => f.name && f.name !== ".emptyFolderPlaceholder").map(f => ({
            id: f.id, name: f.name,
            url: `${SUPABASE_URL}/storage/v1/object/public/patient-photos/${patientId}/${f.name}`,
            date: new Date(f.created_at).toLocaleDateString("ko-KR", { month:"long", day:"numeric" }),
            dateStr: new Date(f.created_at).toISOString().slice(0, 10),
            isToday: new Date(f.created_at).toLocaleDateString("ko-KR", { month:"long", day:"numeric" }) === today,
            isVideo: /\.(mp4|mov|avi)$/i.test(f.name)
          })));
        }
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  };

  useEffect(() => { loadPhotos(); }, [patientId]);
  return { photos, setPhotos, loading, reload: loadPhotos };
}

// 핀치줌 사진 뷰어
function PhotoViewer({ photo, onClose }) {
  const imgRef = React.useRef();
  const scale = React.useRef(1);
  const lastDist = React.useRef(0);
  const origin = React.useRef({ x: 0, y: 0 });
  const translate = React.useRef({ x: 0, y: 0 });

  const getDistance = (t) => {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  };

  const applyTransform = () => {
    if (imgRef.current) {
      imgRef.current.style.transform = `translate(${translate.current.x}px, ${translate.current.y}px) scale(${scale.current})`;
    }
  };

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      lastDist.current = getDistance(e.touches);
      origin.current = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    }
  };

  const onTouchMove = (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = getDistance(e.touches);
      const delta = dist / lastDist.current;
      scale.current = Math.min(Math.max(scale.current * delta, 0.5), 5);
      lastDist.current = dist;
      applyTransform();
    }
  };

  const onDoubleTap = (() => {
    let last = 0;
    return () => {
      const now = Date.now();
      if (now - last < 300) {
        scale.current = scale.current > 1.5 ? 1 : 2.5;
        translate.current = { x: 0, y: 0 };
        applyTransform();
      }
      last = now;
    };
  })();

  return React.createElement("div", {
    style: { position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
      background: "rgba(0,0,0,0.95)", zIndex: 999,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      overflow: "hidden" },
    onTouchStart: onTouchStart,
    onTouchMove: onTouchMove,
    onClick: onDoubleTap,
  },
    React.createElement("div", { style: { position: "absolute", top: 16, right: 16, zIndex: 1000 } },
      React.createElement("button", { onClick: (e) => { e.stopPropagation(); onClose(); },
        style: { background: "rgba(255,255,255,0.25)", border: "none", color: "white",
          borderRadius: "50%", width: 44, height: 44, fontSize: 22, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center" } }, "✕")
    ),
    React.createElement("div", { style: { fontSize: 12, color: "rgba(255,255,255,0.5)", marginBottom: 10 } },
      "👆 두 손가락 확대 · 두 번 탭 2.5배 확대"
    ),
    React.createElement("img", {
      ref: imgRef,
      src: photo.url,
      style: {
        maxWidth: "100%", maxHeight: "78vh", borderRadius: 8,
        objectFit: "contain", transformOrigin: "center center",
        transition: "transform 0.05s", userSelect: "none", pointerEvents: "none"
      }
    }),
    React.createElement("div", { style: { fontSize: 13, color: "rgba(255,255,255,0.6)", marginTop: 10, fontWeight: 600 } },
      photo.date)
  );
}

  const fileRef = React.useRef();

  const handleFile = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    setUploading(true);
    for (const file of files) {
      const ext = file.name.split(".").pop();
      const fname = `${Date.now()}.${ext}`;
      await fetch(`${SUPABASE_URL}/storage/v1/object/patient-photos/${patientId}/${fname}`, {
        method: "POST",
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY, "Content-Type": file.type },
        body: file

      const url = `${SUPABASE_URL}/storage/v1/object/public/patient-photos/${patientId}/${fname}`;

        date: new Date().toLocaleDateString("ko-KR", { month:"long", day:"numeric" }),
        isVideo: file.type.startsWith("video/") }, ...prev].slice(0, 12));

function categoryToNum(val, map) {
  if (!val) return null;
  const idx = map.indexOf(val);
  return idx >= 0 ? idx + 1 : null;
}

// ── 공통 BPSD 표시 컴포넌트 ─────────────────────────────────
function BpsdDisplay({ value, style }) {
  if (!value) return null;
  const items = Array.isArray(value)
    ? value
    : value.split("·").map(s => s.trim()).filter(Boolean);
  if (!items.length) return null;
  const isNormal = items.length === 1 && items[0] === "이상없음";

  // 섬망 정도 판단
  const deliriumItems = items.filter(s =>
    ["섬망","야간혼돈","수면장애","반복소리","혼잣말","다칠위험"].some(k => s.includes(k))
  );
  const getDeliriumLevel = () => {
    if (items.some(s => s.includes("심한 섬망") || s.includes("매우심함"))) return { label: "매우심함", color: "#dc2626", bg: "#fee2e2" };
    if (items.some(s => s.includes("섬망"))) return { label: "심함", color: "#ef4444", bg: "#fee2e2" };
    if (items.some(s => s.includes("야간혼돈") || s.includes("다칠위험"))) return { label: "중간", color: "#f59e0b", bg: "#fffbeb" };
    if (deliriumItems.length > 0) return { label: "경함", color: "#65a30d", bg: "#f7fee7" };
    return null;
  };
  const deliriumLevel = getDeliriumLevel();

  return React.createElement("div", { style: {
    background: "#faf5ff", borderRadius: 10, border: "1.5px solid #e9d5ff",
    overflow: "hidden", ...style
  } },
    React.createElement("div", { style: {
      padding: "8px 14px", borderBottom: "1.5px solid #e9d5ff",
      fontSize: 13, fontWeight: 800, color: "#6d28d9", background: "#f3e8ff",
      display: "flex", justifyContent: "space-between", alignItems: "center"
    } },
      React.createElement("span", null, "🧩 BPSD (치매 행동·심리 증상)"),
      deliriumLevel && React.createElement("span", { style: {
        fontSize: 12, fontWeight: 800, background: deliriumLevel.bg,
        color: deliriumLevel.color, borderRadius: 20, padding: "2px 10px"
      } }, `섬망 ${deliriumLevel.label}`)
    ),
    React.createElement("div", { style: { padding: "10px 14px", display: "flex", flexWrap: "wrap", gap: 6 } },
      isNormal
        ? React.createElement("span", { style: { background: "#16a34a", color: "white", borderRadius: 8, fontSize: 13, fontWeight: 700, padding: "4px 12px" } }, "이상없음")
        : items.map((s, i) => React.createElement("span", { key: i, style: {
            background: "#ede9fe", color: "#5b21b6", borderRadius: 8,
            fontSize: 13, fontWeight: 600, padding: "4px 10px", border: "1px solid #c4b5fd"
          } }, s))
    )
  );
}

// ── 커스텀 달력 컴포넌트 ─────────────────────────────────────
function CustomCalendar({ value, onChange }) {
  const today = new Date();
  const todayStr = today.toISOString().split("T")[0];

  const [viewYear, setViewYear] = React.useState(today.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(today.getMonth());

  const DAYS = ["일","월","화","수","목","금","토"];
  const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const prevMonth = () => {
    if (viewMonth === 0) { setViewYear(y => y - 1); setViewMonth(11); }
    else setViewMonth(m => m - 1);
  };
  const nextMonth = () => {
    if (viewMonth === 11) { setViewYear(y => y + 1); setViewMonth(0); }
    else setViewMonth(m => m + 1);
  };

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const toStr = (d) => `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  return React.createElement("div", { style: { background: "white", borderRadius: 16, border: "1.5px solid #e2e8f0", overflow: "hidden", boxShadow: "0 2px 12px rgba(0,0,0,0.06)" } },
    // 헤더
    React.createElement("div", { style: { background: "linear-gradient(135deg,#1e3a5f,#2563eb)", padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between" } },

// ── 보호자 화면 ───────────────────────────────────────────────
function GuardianScreen({ user, onBack }) {
  const [tabStack, setTabStack] = useState(["today"]);
  const tab = tabStack[tabStack.length - 1];

  const goTab = (t) => {
    setTabStack(prev => {
      if (prev[prev.length - 1] === t) return prev;
      return [...prev, t];
    });
  };

  const handleBack = () => {
    if (tabStack.length > 1) {
      setTabStack(prev => prev.slice(0, -1));
    } else {
      onBack();
    }
  };

  // 브라우저/폰 뒤로가기 → handleBack 연결
  useEffect(() => {
    window.history.pushState({ anbu: "guardian" }, "");
    const onPop = () => {
      handleBack();
      window.history.pushState({ anbu: "guardian" }, "");
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [tabStack]);
  const [record, setRecord] = useState(null);
  const [history, setHistory] = useState([]);
  const [histLoading, setHistLoading] = useState(false);
  const [expandedDate, setExpandedDate] = useState(null);
  const [loading, setLoading] = useState(true);
  const [msgForm, setMsgForm] = useState({ visitDate: "", visitTime: "", body: "" });
  const [sending, setSending] = useState(false);
  const patient = user.patient;

  useEffect(() => {
    // 오늘 기록 + 최근 7일 기록 병렬 로드
    const frames = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const kst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
      frames.push(kst.toISOString().slice(0, 10));
    }

    Promise.all([
      api("get_today_record", { patientId: patient.id, phone: user.phone }),
      fetch(`${SUPABASE_URL}/rest/v1/records?patient_id=eq.${patient.id}&order=date.asc&limit=30`, {
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
      }).then(r => r.json())
    ])
    .then(([todayData, histData]) => {
      const todayRecord = todayData.record;
      setRecord(todayRecord);
      const records = Array.isArray(histData) ? histData : [];
      const filled = frames.map(date => {
        // 오늘 날짜는 get_today_record 결과 우선 사용
        if (todayRecord && date === todayRecord.date) return todayRecord;
        const found = records.find(r => r.date === date);
        return found || { date, _empty: true };
      });
      setHistory(filled);
    })
    .catch(() => {
      setHistory(frames.map(date => ({ date, _empty: true })));
    })
    .finally(() => setLoading(false));
  }, []);

  // 지난 기록 탭 클릭 시 히스토리 로드 (이미 로드됐으면 스킵)

    if (tab === "history" && history.length === 0) {
      setHistLoading(true);
      const frames = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const kst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
        frames.push(kst.toISOString().slice(0, 10));
      }
      fetch(`${SUPABASE_URL}/rest/v1/records?patient_id=eq.${patient.id}&order=date.asc&limit=30`, {
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
      })
      .then(r => r.json())
      .then(data => {
        const records = Array.isArray(data) ? data : [];
        const filled = frames.map(date => {
          const found = records.find(r => r.date === date);
          return found || { date, _empty: true };
        });
        setHistory(filled);
      })
      .catch(() => setHistory(frames.map(date => ({ date, _empty: true }))))
      .finally(() => setHistLoading(false));

  const CONSCIOUSNESS_MAP = ["혼수","반혼수","혼미","졸림","명료"];

// ── 간호사 변화없음/변화있음 선택 화면 ──────────────────────────
function NurseChooseScreen({ patient, user, onNoChange, onEdit, onBack }) {
  const [tab, setTab] = useState("today");
  const [yesterdayRecord, setYesterdayRecord] = useState(null);
  const [todayRecord, setTodayRecord] = useState(null);
  const [loading, setLoading] = useState(true);
  const [history, setHistory] = useState([]);
  const [histLoading, setHistLoading] = useState(false);
  const [expandedDate, setExpandedDate] = useState(null);

  const CONSCIOUSNESS_MAP = ["혼수","반혼수","혼미","졸림","명료"];
  const MEAL_MAP = ["안 드심","거의 안 드심","절반","잘 드심"];
  const SLEEP_MAP = ["4시간 미만","4~6시간","6~8시간","8시간 이상"];
  const MOBILITY_MAP = ["침상 안정","휠체어","부축 보행","워커","독립 보행"];
  const goodHighColor = (v, max) => {
    const pct = v / max;
    return pct >= 0.75 ? "#16a34a" : pct >= 0.5 ? "#65a30d" : pct >= 0.25 ? "#f59e0b" : "#ef4444";
  };

  useEffect(() => {
    const now = new Date();
    const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
    kst.setDate(kst.getDate() - 1);
    const yStr = kst.toISOString().slice(0, 10);
    const todayStr = new Date(new Date().getTime() + 9*60*60*1000).toISOString().slice(0,10);
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/records?patient_id=eq.${patient.id}&date=eq.${yStr}&limit=1`, {
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
      }).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/records?patient_id=eq.${patient.id}&date=eq.${todayStr}&limit=1`, {
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
      }).then(r => r.json())
    ]).then(([yData, tData]) => {
      setYesterdayRecord(yData && yData.length > 0 ? yData[0] : null);
      setTodayRecord(tData && tData.length > 0 ? tData[0] : null);
    }).finally(() => setLoading(false));
  }, []);

  useEffect(() => {
    if (tab === "history" && history.length === 0) {
      setHistLoading(true);
      const frames = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const kst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
        frames.push(kst.toISOString().slice(0, 10));
      }
      fetch(`${SUPABASE_URL}/rest/v1/records?patient_id=eq.${patient.id}&order=date.asc&limit=30`, {
        headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
      })
      .then(r => r.json())
      .then(data => {
        const records = Array.isArray(data) ? data : [];
        const filled = frames.map(date => {
          const found = records.find(r => r.date === date);
          return found || { date, _empty: true };
        });
        setHistory(filled);
      })
      .catch(() => setHistory(frames.map(date => ({ date, _empty: true }))))
      .finally(() => setHistLoading(false));

function DoctorScreen({ user, onBack }) {
  const [patients, setPatients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    api("get_patients", { doctorId: user.doctor_id })
      .then(d => setPatients(d.patients || []))
      .finally(() => setLoading(false));
  }, []);

  // 뒤로가기 처리
  useEffect(() => {
    window.history.pushState({ anbu: "doctor" }, "");
    const onPop = () => {
      if (selected) {
        setSelected(null);
        window.history.pushState({ anbu: "doctor" }, "");
      } else {
        if (window.confirm("로그아웃 하시겠습니까?")) {
          onBack();
        } else {
          window.history.pushState({ anbu: "doctor" }, "");
        }
      }
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, [selected]);

  if (selected) return React.createElement(DoctorReviewScreen, {
    patient: selected, user, onBack: () => setSelected(null)
  });

  return React.createElement("div", { className: "screen", style: { background: "#f0f4f8" } },
    React.createElement("div", { style: { background: "linear-gradient(135deg,#1e1b4b,#4338ca)", padding: "48px 20px 20px" } },
      React.createElement("div", { className: "header-top" },
        React.createElement("button", { className: "back-btn", onClick: onBack }, "← 역할 선택"),
        React.createElement("button", { className: "logout-btn", onClick: onBack }, "로그아웃 →")
      ),
      React.createElement("div", { style: { fontSize: 15, color: "rgba(255,255,255,0.5)", marginTop: 8 } }, `오늘안부 · 천안쌍용요양병원 · ${user.name} 원장`),
      React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 4 } },
        React.createElement("div", { style: { fontSize: 18, fontWeight: 800, color: "white" } }, "환자 현황"),
        React.createElement("div", { style: { fontSize: 15, color: "rgba(255,255,255,0.7)" } }, `담당 ${patients.length}명`)
      ),
      React.createElement("div", { style: { marginTop: 8 } })
    ),

    React.createElement("div", { className: "scroll-area", style: { paddingTop: 16 } },
      loading ? React.createElement("div", { className: "loading" }, "불러오는 중...")
      : React.createElement(PatientGrid, { patients, onSelect: setSelected })
    )
  );
}

// ── 메인 앱 ───────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("splash");
  const [role, setRole] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    const seen = localStorage.getItem("anbu_onboarded");
    setScreen(seen ? "roleSelect" : "onboarding");
  }, []);

  const handleOnboardDone = () => {
    localStorage.setItem("anbu_onboarded", "1");
    setScreen("roleSelect");
  };

  const handleRoleSelect = (r) => {
    if (r === "notices") { setRole("notices"); setScreen("notices"); return; }
    setRole(r);
    setScreen("login");
  };

  const handleLogin = (user) => {
    setCurrentUser(user);
    setScreen("app");
  };

  const handleLogout = () => {
    if (!window.confirm("로그아웃 하시겠습니까?")) return;
    setCurrentUser(null);
    setRole(null);
    setScreen("roleSelect");
  };

  if (screen === "splash") return React.createElement("div", { style: { minHeight: "100vh", background: "linear-gradient(160deg,#0f172a,#1e3a5f)", display: "flex", alignItems: "center", justifyContent: "center" } },
    React.createElement("div", { style: { fontSize: 32, fontWeight: 900, color: "white" } }, "오늘안부")
  );

  if (screen === "onboarding") return React.createElement(OnboardingScreen, { onDone: handleOnboardDone });
  if (screen === "notices") return React.createElement(NoticesScreen, { onBack: () => setScreen("roleSelect") });
  if (screen === "roleSelect") return React.createElement(RoleSelectScreen, { onSelect: handleRoleSelect });
  if (screen === "login") return React.createElement(LoginScreen, {
    loginType: role,
    onLogin: handleLogin,
    onBack: () => setScreen("roleSelect"),
    onSignup: () => setScreen("signup")
  });
  if (screen === "signup") return React.createElement(GuardianSignupScreen, {
    onBack: () => setScreen("login"),
    onDone: () => setScreen("login")
  });

  if (screen === "app" && currentUser) {
    if (currentUser.role === "guardian") return React.createElement(GuardianScreen, { user: currentUser, onBack: handleLogout });
    if (currentUser.loginAs === "messages") return React.createElement(MessagesScreen, { user: currentUser, onBack: handleLogout });
    if (currentUser.role === "nurse") return React.createElement(NurseScreen, { user: currentUser, onBack: handleLogout });
    if (currentUser.role === "doctor") return React.createElement(DoctorScreen, { user: currentUser, onBack: handleLogout });
    if (currentUser.role === "admin") return React.createElement(AdminScreen, { user: currentUser, onBack: handleLogout });
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
